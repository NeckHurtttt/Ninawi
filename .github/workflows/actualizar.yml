name: Focos de los últimos 7 días
on:
  schedule:
    - cron: "15 12 * * *"   # todos los días 08:15 hora de Bolivia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -I scripts/actualizar.py web/datos
      - run: |
          git config user.name "brasa-bot"
          git config user.email "brasa-bot@users.noreply.github.com"
          git add web/datos/ultimos7.json
          git diff --cached --quiet || git commit -m "Focos de los últimos 7 días"
          git push
